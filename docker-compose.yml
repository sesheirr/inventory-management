services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventory-management-app:latest
    container_name: inventory_app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8443:8443"
      - "5173:5173"
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
        required: false
    networks:
      - inventory_network

  db:
    image: mysql:8.4
    container_name: inventory_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: secret
    volumes:
      - inventory_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - inventory_network

volumes:
  inventory_db_data:
    driver: local

networks:
  inventory_network:
    driver: bridge
